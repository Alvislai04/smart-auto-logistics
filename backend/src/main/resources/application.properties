spring.application.name=autologistics

server.port=8080

spring.config.import=optional:file:../.env[.properties],optional:file:.env[.properties]
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
app.jwt.secret=${JWT_SECRET:smart-auto-logistics-secure-jwt-secret-key-change-before-deployment}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

app.bootstrap-admin.enabled=${APP_BOOTSTRAP_ADMIN_ENABLED:false}
app.bootstrap-admin.full-name=${APP_BOOTSTRAP_ADMIN_FULL_NAME:}
app.bootstrap-admin.email=${APP_BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap-admin.password=${APP_BOOTSTRAP_ADMIN_PASSWORD:}

app.blockchain.enabled=${BLOCKCHAIN_ENABLED:false}
app.blockchain.rpc-url=${BLOCKCHAIN_RPC_URL:http://127.0.0.1:8545}
app.blockchain.contract-address=${BLOCKCHAIN_CONTRACT_ADDRESS:}
app.blockchain.private-key=${BLOCKCHAIN_PRIVATE_KEY:}
app.blockchain.gas-price-wei=${BLOCKCHAIN_GAS_PRICE_WEI:20000000000}
app.blockchain.gas-limit=${BLOCKCHAIN_GAS_LIMIT:250000}
app.blockchain.receipt-polling-interval-ms=${BLOCKCHAIN_RECEIPT_POLLING_INTERVAL_MS:1000}
app.blockchain.receipt-polling-attempts=${BLOCKCHAIN_RECEIPT_POLLING_ATTEMPTS:40}

app.simulation.scheduler-enabled=${SIMULATION_SCHEDULER_ENABLED:true}
app.simulation.scheduler-delay-ms=${SIMULATION_SCHEDULER_DELAY_MS:5000}
