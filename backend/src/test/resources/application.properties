spring.datasource.url=jdbc:h2:mem:autologistics_test_${random.uuid};MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

app.jwt.secret=autologistics-test-jwt-secret-key-with-at-least-thirty-two-bytes
app.jwt.expiration-ms=86400000
app.bootstrap-admin.enabled=false
app.blockchain.enabled=false
app.simulation.scheduler-enabled=false
app.stock-monitoring.scheduler-enabled=false

spring.task.scheduling.enabled=false
