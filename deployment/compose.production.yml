services:
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DB_URL: ${DB_URL:?DB_URL is required}
      DB_USERNAME: ${DB_USERNAME:?DB_USERNAME is required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: ${DB_POOL_MAX_SIZE:-5}
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: ${DB_POOL_MIN_IDLE:-1}
      SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT: ${DB_POOL_CONNECTION_TIMEOUT_MS:-10000}
      SPRING_DATASOURCE_HIKARI_IDLE_TIMEOUT: ${DB_POOL_IDLE_TIMEOUT_MS:-300000}
      SPRING_DATASOURCE_HIKARI_MAX_LIFETIME: ${DB_POOL_MAX_LIFETIME_MS:-1200000}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:8088}
      APP_BOOTSTRAP_ADMIN_ENABLED: ${APP_BOOTSTRAP_ADMIN_ENABLED:-false}
      APP_BOOTSTRAP_ADMIN_FULL_NAME: ${APP_BOOTSTRAP_ADMIN_FULL_NAME:-}
      APP_BOOTSTRAP_ADMIN_EMAIL: ${APP_BOOTSTRAP_ADMIN_EMAIL:-}
      APP_BOOTSTRAP_ADMIN_PASSWORD: ${APP_BOOTSTRAP_ADMIN_PASSWORD:-}
      SIMULATION_SCHEDULER_ENABLED: ${SIMULATION_SCHEDULER_ENABLED:-true}
      SIMULATION_SCHEDULER_DELAY_MS: ${SIMULATION_SCHEDULER_DELAY_MS:-5000}
      SIMULATION_DEFAULT_INTERVAL_SECONDS: ${SIMULATION_DEFAULT_INTERVAL_SECONDS:-15}
      SIMULATION_DEFAULT_MAX_EVENTS: ${SIMULATION_DEFAULT_MAX_EVENTS:-500}
      STOCK_MONITORING_SCHEDULER_ENABLED: ${STOCK_MONITORING_SCHEDULER_ENABLED:-true}
      STOCK_MONITORING_SCHEDULER_DELAY_MS: ${STOCK_MONITORING_SCHEDULER_DELAY_MS:-30000}
      BLOCKCHAIN_ENABLED: ${BLOCKCHAIN_ENABLED:-false}
      BLOCKCHAIN_RPC_URL: ${BLOCKCHAIN_RPC_URL:-http://host.docker.internal:8545}
      BLOCKCHAIN_CONTRACT_ADDRESS: ${BLOCKCHAIN_CONTRACT_ADDRESS:-}
      BLOCKCHAIN_PRIVATE_KEY: ${BLOCKCHAIN_PRIVATE_KEY:-}
      BLOCKCHAIN_GAS_PRICE_WEI: ${BLOCKCHAIN_GAS_PRICE_WEI:-20000000000}
      BLOCKCHAIN_GAS_LIMIT: ${BLOCKCHAIN_GAS_LIMIT:-250000}
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_JPA_SHOW_SQL: "false"
    expose:
      - "8080"
    networks:
      - autologistics

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
        VITE_DASHBOARD_REFRESH_MS: ${VITE_DASHBOARD_REFRESH_MS:-15000}
        VITE_ALERT_BADGE_REFRESH_MS: ${VITE_ALERT_BADGE_REFRESH_MS:-15000}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${APP_PORT:-8088}:80"
    networks:
      - autologistics

networks:
  autologistics:
    driver: bridge
