services:
  - type: web
    name: smart-auto-logistics-api
    runtime: docker
    plan: starter
    region: singapore
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /actuator/health
    autoDeployTrigger: commit
    numInstances: 1
    envVars:
      - key: PORT
        value: "8080"
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION_MS
        value: "86400000"
      - key: APP_CORS_ALLOWED_ORIGINS
        sync: false
      - key: APP_BOOTSTRAP_ADMIN_ENABLED
        value: "false"
      - key: SPRING_JPA_HIBERNATE_DDL_AUTO
        value: validate
      - key: SPRING_JPA_SHOW_SQL
        value: "false"
      - key: SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE
        value: "5"
      - key: SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE
        value: "1"
      - key: SIMULATION_SCHEDULER_ENABLED
        value: "true"
      - key: SIMULATION_SCHEDULER_DELAY_MS
        value: "5000"
      - key: SIMULATION_DEFAULT_INTERVAL_SECONDS
        value: "15"
      - key: SIMULATION_DEFAULT_MAX_EVENTS
        value: "500"
      - key: STOCK_MONITORING_SCHEDULER_ENABLED
        value: "true"
      - key: STOCK_MONITORING_SCHEDULER_DELAY_MS
        value: "30000"
      - key: BLOCKCHAIN_ENABLED
        value: "false"
